# ============================================
#   EmojiManager - 主配置文件 (config.yml)
#   修改后输入 /em reload 即可热重载
# ============================================

# ---------- 头顶显示设置 ----------
display:
  scale: 2.0
  offset-x: 0.0
  offset-y: 2.2
  offset-z: 0.0

# ---------- 特效设置 ----------
effects:
  enabled: true
  default-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  default-particle: HEART
  particle-count: 5

# ---------- 聊天同步设置 ----------
chat-sync:
  enabled: true
  message: "&e%player% &r使用了表情 %symbol%"

# ---------- 发送冷却限制 ----------
cooldown:
  # 冷却时间（秒），0 表示不限制
  seconds: 0
  # 冷却中提示消息 (%seconds% = 剩余秒数)
  message: "&c请等待 %seconds% 秒后再发送表情。"