# ============================================
#   EmojiManager - Emoji Configuration (emotes.yml)
#   ⚠️ Note: Do NOT edit this file directly.
#   Edit plugins/EmojiManager/emotes.yml instead.
#   Then run /em reload to apply changes.
# ============================================

# Each emoji is defined under "emotes"
emotes:

  # ---------- Emoji ID ----------
  # Must be lowercase English, no spaces or special characters.
  # Used by commands (/e heart) and admin commands.
  # Must be unique across all emojis.
  heart:

    # ---------- Display Name ----------
    # Name shown in the GUI. Supports any UTF-8 characters.
    name: "Heart"

    # ---------- Overhead Symbol ----------
    # Characters displayed above the player's head.
    # Can be emoji or any Unicode character (e.g., ☀️💎⭐).
    symbol: "❤️"

    # ---------- Skin Texture ----------
    # Determines the appearance of the head in the GUI.
    # Two ways to fill:
    #
    # Method 1: MineSkin Base64 (Recommended)
    #   1. Visit https://mineskin.org
    #   2. Upload your emoji image (64x64 PNG suggested)
    #   3. Copy the generated "Value" field (a long string starting with eyJ)
    #   4. Paste it here
    #
    # Method 2: Premium Username
    #   Enter a valid Minecraft premium player name (e.g., Notch, Dream).
    #   The plugin will automatically fetch their skin as the emoji icon.
    #   Note: The player must exist and have a premium account.
    texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNWIwY2MwYjFjZDIwZjI2MjI0Mjg4MjI1YjI5YjM4MjBhYzk0NjI0N2Y4MjQ4MjY3ZGFmM2I4M2Q3YzY4Y2IifX19"

    # ---------- Price ----------
    # Cost in coins (requires Vault and an economy plugin).
    # Set to 0 for free – it will be auto-unlocked when the GUI is opened.
    price: 100

    # ---------- Enabled ----------
    # true  = visible in GUI, usable by players
    # false = hidden (config preserved but not shown)
    # Can be toggled via /em gui edit remove/add
    enabled: true

    # ---------- Sound Effect (Optional) ----------
    # Played when this emoji is used.
    # If omitted, the default sound from config.yml is used.
    # Available sounds: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
    # Common sounds:
    #   ENTITY_EXPERIENCE_ORB_PICKUP
    #   ENTITY_CHICKEN_EGG
    #   ENTITY_PLAYER_LEVELUP
    #   BLOCK_NOTE_BLOCK_PLING
    #   ENTITY_FIREWORK_ROCKET_BLAST
    sound: ENTITY_CHICKEN_EGG

    # ---------- Particle Effect (Optional) ----------
    # Displayed when this emoji is used.
    # If omitted, the default particle from config.yml is used.
    # Available particles: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Particle.html
    # Common particles:
    #   HEART
    #   FLAME
    #   NOTE
    #   VILLAGER_HAPPY
    #   TOTEM_OF_UNDYING
    particle: HEART

  # ============================================
  #   More emoji examples (copy the format above)
  # ============================================

  laugh:
    name: "Tears of Joy"
    symbol: "😂"
    texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjI3OTFjYzFiNDk5OWEzMjcxNGU1YjJkYzY3M2JjYTQwYjJmYjI3ZGI0YzJlM2E4YzQxNzI5ZjgzZWM1MCJ9fX0="
    price: 200
    enabled: true
    # sound and particle are omitted, so defaults from config.yml apply

  fire:
    name: "Fire"
    symbol: "🔥"
    texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzY5MTk2YjMzMGM2Yjg5NjJmMjNhZDU2MjdmYjZlYzNlM2M4M2YzMjdmZjlmZDVmZDY0YWMzYjViNjQzYjVlIn19fQ=="
    price: 150
    enabled: true
    particle: FLAME

  # ---------- How to Add a New Emoji ----------
  # Add a new entry under "emotes:" like this:
  #
  # your-emoji-id:
  #   name: "My Emoji"
  #   symbol: "😊"
  #   texture: "eyJ... or premium username"
  #   price: 50
  #   enabled: true
  #
  # Save the file and run /em reload to apply.