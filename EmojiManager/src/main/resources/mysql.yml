# ============================================
#   EmojiManager - MySQL Database Configuration
#   Used only when storage.type = mysql
# ============================================

mysql:
  host: localhost
  port: 3306
  database: emojimanager
  username: root
  password: your_password
  use-ssl: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 5000
    idle-timeout: 300000
    max-lifetime: 600000