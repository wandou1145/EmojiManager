# ============================================
#   EmojiManager - Main Configuration (config.yml)
#   Use /em reload to apply changes instantly
# ============================================

# ---------- Overhead Display Settings ----------
display:
  # Text scale multiplier (1.0 = default size, 2.0 = double)
  scale: 2.0
  # Left/right offset (positive = right, negative = left)
  offset-x: 0.0
  # Vertical offset (positive = up, negative = down)
  offset-y: 2.2
  # Forward/backward offset (positive = forward, negative = back)
  offset-z: 0.0

# ---------- Effects Settings ----------
effects:
  # Whether effects are enabled (false disables all sounds and particles)
  enabled: true
  # Default sound when emoji has no custom sound
  # Available sounds: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
  default-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  # Default particle when emoji has no custom particle
  # Available particles: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Particle.html
  default-particle: HEART
  # Number of particles to spawn
  particle-count: 5

# ---------- Chat Sync Settings ----------
chat-sync:
  # Whether to broadcast a message when an emoji is used
  enabled: true
  # Message template (%player% = player name, %symbol% = emoji symbol)
  message: "&e%player% &rused emoji %symbol%"

# ---------- Cooldown Settings ----------
cooldown:
  # Cooldown in seconds (0 = no limit)
  seconds: 0
  # Message shown when on cooldown (%seconds% = remaining seconds)
  message: "&cPlease wait %seconds% second(s) before sending another emoji."