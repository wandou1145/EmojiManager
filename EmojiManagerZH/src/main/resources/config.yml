# ============================================
#   EmojiManager 主配置 - 中文版
#   修改后输入 /em reload 即可热重载
# ============================================

# ---------- 存储设置 ----------
storage:
  # yaml = 本地文件存储，mysql = MySQL 数据库（跨服同步）
  type: yaml

# ---------- 头顶显示设置 ----------
display:
  # 文字缩放倍数（1.0 = 默认大小，2.0 = 放大一倍）
  scale: 2.0
  # 左右偏移（正数向右，负数向左）
  offset-x: 0.0
  # 高度偏移（正数向上，负数向下）
  offset-y: 2.2
  # 前后偏移（正数向前，负数向后）
  offset-z: 0.0

# ---------- 特效设置 ----------
effects:
  # 是否启用特效（false 关闭所有音效和粒子）
  enabled: true
  # 默认音效（表情未单独设置时使用）
  default-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  # 默认粒子（表情未单独设置时使用）
  default-particle: HEART
  # 粒子数量
  particle-count: 5

# ---------- 聊天同步设置 ----------
chat-sync:
  # 是否在聊天栏广播表情发送消息
  enabled: true
  # 消息模板（%player% = 玩家名，%symbol% = 表情符号）
  message: "&e%player% &r使用了表情 %symbol%"

# ---------- 发送冷却限制 ----------
cooldown:
  # 冷却时间（秒），0 表示不限制
  seconds: 0
  # 冷却中提示消息（%seconds% = 剩余秒数）
  message: "&c请等待 %seconds% 秒后再发送表情。"